- id: D01
  date: 2026-10-13
  step: scope
  question: Which per-cell data should the reanalysis use?
  options:
  - label: Original Galaxy segmentation
    pros: same data behind every MRID output Julia has seen; only thresholds and labels change
    cons: FITC-threshold segmentation can miss dying GFP-dim cells
  - label: Cellpose + EGFP gate re-segmentation
    pros: detects more cells, splits touching cells
    cons: needs a full GPU re-run of all 6 experiments first
  decision: Original Galaxy segmentation; XDP10 from the verified complete re-extract.
  rationale: Keeps any change in results attributable to the thresholds and label corrections alone.
  status: approved_austin
  approved_by: Austin
  approved_date: 2026-10-13
- id: D02
  date: 2026-10-13
  step: thresholds
  question: How should S.A. evidence be turned into a live and a dead cutoff?
  options:
  - label: Mixture + 2.5 SD (two cutoffs)
    pros: Julia's established SD convention; S.A. provides a clean live and dead population
    cons: live cutoff can drop low if the dead population is broad (flagged)
  - label: Mixture + 2.5 SD (single cutoff)
    pros: no cells dropped
    cons: no ambiguous zone
  - label: Mixture posterior 9x likelihood
    pros: symmetric
    cons: 9x is an arbitrary convention nobody in the lab uses
  decision: On log10(ratio), fit a 2-component mixture to post-dose S.A.-well cells per line x experiment. Dead cutoff = live
    mean + 2.5 SD; live cutoff = dead mean - 2.5 SD; cells between are dropped; if the two cross, use the inner gap. [Superseded
    at review point A by D18 (only the S.A. dead component is used) and D20 (rules B, C, D computed; live side from untreated
    wells).]
  rationale: Julia suggested SD-from-mean at ~2.5x. On the log scale each population is roughly symmetric, so 2.5 SD means
    ~0.6% of a population falls past the other's cutoff. The mixture measures the live SD from live cells only, which a raw
    SD of a mixed well cannot.
  status: superseded
  approved_by: Austin
  approved_date: 2026-10-13
- id: D03
  date: 2026-10-13
  step: transfer
  question: How are cutoffs set where there is no usable S.A. readout (XDP8, or a case failing the usability rules)?
  options:
