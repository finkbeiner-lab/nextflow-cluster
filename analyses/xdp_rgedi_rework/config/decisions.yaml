- id: D20
  date: '2026-10-13'
  step: thresholds
  decider: Julia and Austin (method)
  question: 'Applying 2.5 SD on both sides does not fit these data: the untreated live population is broad on the log scale,
    so ''live mean + 2.5 SD'' lands at or above the centre of the S.A.-killed population in several cases, and it drifts upward
    late in a run. Which cutoff rule should be used?'
  options:
  - label: 'D: single cutoff at the equal-density boundary between untreated live and S.A. dead'
    pros: set by the S.A.-dead population and the untreated live population; calls almost all of the S.A.-dead population
      dead (Step 6); less sensitive to late drift of living cells than C
    cons: not literally an SD rule
  - label: 'C: single cutoff at S.A.-dead mean - 2.5 SD'
    pros: Julia's 2.5 SD applied to the population S.A. reveals; <= 0.6% of S.A.-dead cells called live
    cons: counts living cells that drift upward late in a run as dead (untreated death up to ~26% in XDP11 by T11)
  - label: 'B: two cutoffs, live side from untreated wells (2.5 SD each side)'
    pros: keeps the two-cutoff scheme; low untreated death
    cons: dead cutoff above the dead-population centre in several cases; leaves a large share of S.A.-dead cells uncalled
      (Step 6, most in XDP11)
  - label: 'A: D02 as written (live side from S.A.-well survivors)'
    pros: as planned
    cons: S.A. survivors are stressed and spread out, pushing the dead cutoff highest; misses the most S.A.-dead cells
  decision: 'Compute two tracks separately and compare them: track 1 = rule D (equal-density boundary between untreated live
    and S.A. dead) with rule C (S.A.-dead mean - 2.5 SD) as its sensitivity analysis; track 2 = rule B (2.5 SD on both sides,
    live side from untreated wells, ambiguous cells dropped). The choice between tracks is made after comparing their outputs.'
  evidence:
  - Step 5.2 cutoff preview
  - Step 5.3 drift over time
  status: approved_austin
  approved_by: Austin (review point A)
  approved_date: '2026-10-13'
