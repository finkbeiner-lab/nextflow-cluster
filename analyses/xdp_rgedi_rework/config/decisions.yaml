- id: D26
  date: '2026-10-14'
  step: counts
  decider: Austin
  question: MRID scores dead cells only among cells still detected, and dying cells lose GFP and drop out of detection. Should
    cell counts over time be added to the death evaluation, and how?
  options:
  - label: S.A.-calibrated visibility check and correction (primary), live-cell retention model with a calibration test
      (cross-check)
    pros: uses the S.A. wells as a within-line calibration experiment; every assumption is testable; runs in minutes
    cons: two new analyses next to MRID; S.A. (acute) death may stay visible differently from spontaneous death
  - label: Single-cell survival on tracks
    pros: per-cell hazards
    cons: most cells lose identity within days (object turnover 15-38% per interval, line-dependent)
  - label: Joint multi-state model
    pros: complete on paper
    cons: entries vs death and unseen death vs non-death loss are not identified from these data
  decision: 'Option 1, rules frozen before any formal fit (pilot numbers had been seen). Counts per well x timepoint use
    the Step 11 live/dead call (lib/livedead.py) and include S.A. wells. QC: a well x timepoint with no cells, or whose
    detected count falls below half of both neighbours and then recovers, is missing; wells with fewer than 50 live cells
    at the baseline are dropped. Capture fraction c = excess visible dead / live cells removed by S.A., per line x
    experiment at the last post-dose fit timepoint (XDP3 T10, XDP5 T9, XDP10 T10, XDP11 T13; XDP10 T9 and the alternative
    pre-dose timepoints as sensitivity), with the expected no-dose counts taken from untreated wells of the same line
    (difference in differences). Usable if the removed fraction is at least 0.10 with bootstrap lower bound above 0.
    Well bootstrap (B = 2000); XDP10 (2 S.A. wells per line) resamples its S.A. counts as Poisson draws and is flagged
    FEW_WELLS. Lines are called equally visible within an experiment if every pairwise 95% CI of log(c_A/c_B) includes 0
    and the heterogeneity Q test has p >= 0.05. If all usable experiments pass, the MRID odds ratios stand as death-rate
    ratios; otherwise the S.A.-corrected odds ratios (log OR + log(c_ref/c_cmp)) become the primary comparison, shown next
    to the uncorrected ones. Corrected odds ratios are computed in every case. Retention window starts at k0 = the
    timepoint in the first half of the run where the pooled untreated detected count (all in-scope lines) peaks; T1 and
    k0+1 as sensitivity. The calibration test (live-cell loss explained by GEDI odds) passes in an experiment if the
    coefficient on cumulative odds is negative with 95% CI excluding 0 and the robust Wald test for remaining line
    differences has p >= 0.05; only then is a dropout-corrected cumulative death reported for that experiment.'
  evidence:
  - Steps 14-17
  status: approved_austin
  approved_by: Austin (plan approval)
  approved_date: '2026-10-14'
- id: D27
  date: '2026-10-14'
  step: counts
  decider: Austin and Julia
  question: After review, should the S.A. capture fractions pass a validity gate, and should the S.A.-corrected odds ratios
    be the primary comparison (the D26 outcome) or a sensitivity range next to the MRID odds ratios?
  options:
  - label: Gate the capture fractions; MRID odds ratios stay primary; corrected odds ratios shown as a sensitivity range
      across readouts (recommended)
    pros: removes capture fractions that cannot be capture (XDP5, c > 1 with no loss of detected cells); does not let a
      readout-dependent factor replace the measured odds ratios; the range shows how much dropout could move them
    cons: departs from the D26 rule frozen before the fits
  - label: Gate the capture fractions; corrected odds ratios primary (D26 outcome with the gate)
    pros: keeps the D26 logic
    cons: the correction depends on the readout timepoint (XDP10 T9 vs T10 reverse the line ranking) and on when each
      line's cells died after dosing, which the simulation shows can create a bias that was not there
  - label: Keep D26 exactly as frozen
    pros: no deviation from the frozen rule
    cons: uses XDP5 capture fractions above 1, which are not capture fractions
  decision: Pending - for discussion with Julia. Both D26 as frozen and the gated versions are computed and shown (Step 17).
  rationale: 'Adversarial review (2026-10-14) found: under a single cutoff c > 1 is only possible if the S.A. wells kept more
    detected cells than the no-dose counterfactual (XDP5: detected cells did not fall); c measured at one readout is not a
    stable property of a line (XDP10 T9 vs T10); the equal-visibility rule calls differences often even when there are
    none (six pairwise tests plus Q); with 3-6 experiments, pooled intervals need small-sample (Hartung-Knapp) intervals.
    Validity gate: a capture fraction is used only if the S.A. wells lost detected cells against the pooled
    detected-cell counterfactual N_SA(pre) x N_UT(post) / N_UT(pre) (95% upper bound of the ratio below 1; this
    approximately bounds c, which exceeds 1 only when detected cells exceed Lhat + Dhat) and fewer than 2.5% of bootstrap
    replicates have c <= 0. With or without the gate the frozen D26 rule makes the corrected odds ratios primary (XDP11
    differs); the recommended option overrides that rule after the results were seen. No option changes the track-1
    conclusion (every XDP-vs-control interval includes 1).'
  evidence:
  - Steps 15-17
  status: proposed
- id: D28
  date: '2026-10-15'
  step: thresholds
  decider: Austin
  question: Rule D uses one cutoff, so every cell is called live or dead. The original approach used two cutoffs with a
    buffer zone between them. How should a buffer zone be built around the rule D centre?
  options:
  - label: Confidence window around the rule D centre
    pros: same fitted live and dead populations as the centre; width adapts to how well the two populations separate in
      each line x experiment; the edges have a plain meaning (90% or 95% sure)
    cons: the confidence level is a choice; drops cells near the centre
  - label: Centre plus or minus k live-SD
    pros: SD language Julia already uses
    cons: which SD and which k are arbitrary; ignores how far apart live and dead sit
  - label: Fixed fold window
    pros: simplest to explain
    cons: width is a pure choice and does not adapt per line
  decision: 'Confidence window, run as a new analysis run (run 2; run 1 = rule D single cutoff, kept unchanged). A cell is
    live if the dead/live density ratio is at most 1/N and dead if it is at least N (equal priors, so the centre is rule
    D); cells in between are dropped. N = 9 (90%, set W90) is primary and N = 19 (95%, set W95) a sensitivity. Edges are
    transferred like the other cutoffs (live-SD offsets). Where the dead edge never reaches the target confidence it is
    capped at the centre of the S.A.-dead population and flagged (XDP11 63D at 95%).'
  evidence:
  - Step 6b
  status: approved_austin
  approved_by: Austin
  approved_date: '2026-10-15'
- id: D29
  date: '2026-10-15'
  step: segmentation (run 3)
  decider: Austin
  question: The neurite analysis (Cellpose-SAM + clean gate) finds many more somas than the Galaxy segmentation used in
