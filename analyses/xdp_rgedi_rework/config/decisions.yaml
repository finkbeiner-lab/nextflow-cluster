    pros: uses the target's own live population plus S.A. evidence
    cons: assumes the offset is stable across experiments (tested by leave-one-experiment-out)
  - label: Borrow absolute values
    pros: simple
    cons: ignores the target's own ratio level
  - label: Exclude
    pros: none needed
    cons: loses XDP8
  decision: Transfer the S.A.-derived offset expressed in live-SD units; a line is never dropped.
  status: approved_austin
  approved_by: Austin
  approved_date: 2026-10-13
