- id: D25
  date: '2026-10-14'
  step: odds_ratios
  decider: Julia and Austin
  question: MRID's combined model treats each line difference as identical in every experiment, but per-experiment differences
    vary far more than that (I2 89-99%). Should the combined analysis include a line-by-experiment random effect (or a random-effects
    meta-analysis across experiments)?
  options:
  - label: Yes - include line x experiment variation
    pros: intervals reflect how reproducible the difference is across experiments; the honest basis for a claim about XDP
      vs control
    cons: wider intervals; departs from MRID as published
  - label: No - keep MRID as is
    pros: unchanged method
    cons: intervals overstate certainty; p-values far too small
